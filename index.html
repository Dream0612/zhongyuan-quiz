color:var(--cream);background:var(--navy);width:34px;height:34px;border-radius:50%;cursor:pointer}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

    .app:has(#quiz.active) .question{width:100%;margin:42px 0 37px;font-size:29px;line-height:1.45;min-height:126px;text-align:center;text-wrap:balance}.app:has(#quiz.active) .answers{position:absolute;left:39px;right:39px;top:256px;height:410px;display:block}.app:has(#quiz.active) .answer{position:absolute;left:0;right:0;height:76px;min-height:76px;padding:0;background:transparent;border:0;box-shadow:none}.app:has(#quiz.active) .answer:nth-child(1){top:0}.app:has(#quiz.active) .answer:nth-child(2){top:111px}.app:has(#quiz.active) .answer:nth-child(3){top:224px}.app:has(#quiz.active) .answer:nth-child(4){top:334px}.app:has(#quiz.active) .answer:hover{background:rgba(255,255,255,.07);transform:none}.app:has(#quiz.active) .answer:active{background:rgba(255,179,75,.18);transform:scale(.99)}.app:has(#quiz.active) .letter{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:54px;margin:0;font-size:42px;line-height:1;text-align:center}.app:has(#quiz.active) .answer-label{position:absolute;left:70px;right:8px;top:0;bottom:0;display:flex;align-items:center;justify-content:center;width:auto;height:auto;min-width:0;padding:0;font-size:16px;line-height:1.35;text-align:center;font-weight:600;white-space:nowrap}.app:has(#quiz.active) .answer-label.compact{font-size:14px}.app:has(#quiz.active) .motto{margin-top:53px;padding:0;color:var(--cream);font-size:12px}

    .app:has(#intro.active) #intro{position:static;padding:0}.app:has(#intro.active) #intro .ghost{display:none}.app:has(#intro.active) #intro .title{position:absolute;left:30px;right:30px;top:150px;font-size:50px;line-height:1.14;text-shadow:0 4px 0 rgba(0,0,0,.28)}.app:has(#intro.active) #intro .lead{position:absolute;left:48px;right:48px;top:265px;margin:0;font-size:12.5px;line-height:1.65}.app:has(#intro.active) #intro .primary{position:absolute;left:-16px;right:-16px;top:658px;height:70px;background:transparent;border:0;box-shadow:none;font-size:19px}.app:has(#intro.active) #intro .primary:hover{background:rgba(255,255,255,.08)}.app:has(#intro.active) #intro .small-note{position:absolute;left:0;right:0;bottom:21px;margin:0;padding-top:13px;border-top:1px solid rgba(230,199,142,.6);color:var(--cream)}
    .app:has(#quiz.active) .motto,.app:has(#result.active) .funeral-note{position:absolute;left:0;right:0;bottom:20px;margin:0;padding-top:14px;border-top:1px solid rgba(230,199,142,.6);color:var(--cream)}.app:has(#result.active) .result-actions{position:relative;top:-66px}
    .app:has(#result.active) .result-ghost{height:270px;width:100%;visibility:visible}.app:has(#result.active) .result-ghost img{display:block;width:100%;height:270px;object-fit:contain}
    @media(max-width:410px){.app:has(#quiz.active) .letter{left:4px;width:50px;font-size:38px}.app:has(#quiz.active) .answer-label{left:62px;right:2px;font-size:13px}.app:has(#quiz.active) .answer-label.compact{font-size:11.5px}.app:has(#quiz.active) .question{font-size:27px}}

<body>
  <main class="app">
    <div class="flame f1" aria-hidden="true"></div><div class="flame f2" aria-hidden="true"></div><div class="flame f3" aria-hidden="true"></div>
    <header class="top"><div class="brand">测测你是什么鬼</div></header>
    <section class="screen intro active" id="intro">
      <div class="ghost" aria-hidden="true"><i class="ghost-body"></i><i class="ghost-hat"></i><i class="ghost-eye e1"></i><i class="ghost-eye e2"></i><i class="ghost-mouth"></i></div>
      <h1 class="title">测测你是<br><span class="accent">什么鬼</span></h1>
      <p class="lead">判官翻开生死簿，发现你在人间留下的，不止一种可爱底色。六道小题，看看你的“鬼设”是哪一款。</p>
      <button class="primary" id="start">开始验明正身</button>
      <p class="small-note">本测试纯属娱乐 · 敬畏生命 · 温柔告别</p>
    </section>
    <section class="screen" id="quiz" aria-live="polite">
      <div class="quiz-head"><button class="back" id="back" aria-label="返回上一题">‹</button><div class="step" id="step">第 1 / 6 题</div><div class="track"><span id="progress"></span></div></div>
      <h2 class="question" id="question"></h2><div class="answers" id="answers"></div>
      <p class="motto">认真告别，也认真生活</p>
    </section>
    <section class="screen loading" id="loading"><div class="seal">判官<br>已阅</div><h2>正在翻阅你的灵魂底色…</h2></section>
    <section class="screen result" id="result" aria-live="polite">
      <div class="scroll"><div class="overline">判官已阅 · 你的灵魂底色是</div><h2 class="result-title" id="resultTitle"></h2><p class="result-desc" id="resultDesc"></p>
        <div class="result-ghost"><img id="resultGhostImage" src="assets/ghost-wise.png" alt="测试结果鬼设形象"></div>
        <div class="traits" id="traits"></div><p class="belief" id="belief"></p></div>
      <div class="result-actions"><button class="primary" id="share">生成我的鬼设海报</button><button class="text-btn" id="restart">再测一次</button></div>
      <p class="funeral-note">所有认真道别的人，都在认真地爱。愿每一份想念，都有处安放。</p>
    </section>
  </main>
  <dialog class="share-dialog" id="dialog"><div class="poster-wrap"><button class="close" id="close" aria-label="关闭">×</button><img id="poster" alt="我的鬼设结果海报"><div class="dialog-actions"><button class="primary" id="download">保存海报</button></div></div></dialog>
  <canvas class="sr-only" id="canvas" width="1080" height="1440"></canvas>
  <script src="assets/ghost-data.js"></script>
  <script>
  const questions=[
    {q:'朋友情绪低落时，你更像哪一种陪伴？',a:[['陪他把问题理清楚','wise'],['讲个冷笑话哄他开心','happy'],['安静坐着，等他开口','timid'],['突然做个鬼脸逗他','mischief']]},
    {q:'面对人生里没法回避的告别，你会？',a:[['提前了解，把事情安排妥帖','wise'],['珍惜眼前，把想说的话说完','happy'],['需要一点时间鼓起勇气','timid'],['留下一个特别的纪念','mischief']]},
    {q:'遇到一场告别，你最先注意到的是？',a:[['每个细节有没有稳稳落地','wise'],['现场有没有一点温暖','happy'],['自己会不会忍不住掉眼泪','timid'],['仪式有没有独特的小巧思','mischief']]},
    {q:'如果今晚鬼门大开，你最可能在做什么？',a:[['研究传说到底有几分道理','wise'],['拉着新朋友组一局游戏','happy'],['躲在被窝里只露一只眼','timid'],['偷偷换上最吸睛的鬼设','mischief']]},
    {q:'你希望别人想起你时，首先想起？',a:[['“他总是很有分寸”','wise'],['“他总能让大家轻松一点”','happy'],['“他其实柔软又重感情”','timid'],['“他活得很有自己的样子”','mischief']]},
    {q:'为一段重要记忆选一种保存方式，你会选？',a:[['好好收好，然后继续向前','wise'],['讲成故事，让更多人记住','happy'],['写进一封不寄出的信','timid'],['做成一本有趣的纪念册','mischief']]}
  ];
  const results={
    wise:{title:'人间清醒鬼',desc:'你看得透，也接得住。懂得体面告别，更懂得把每个今天过好。',traits:['通透','有分寸','重情义'],belief:'好的告别，不是忘记，而是让想念有处安放。',color:'#8c85ff'},
    happy:{title:'人间开心鬼',desc:'你自带一点微光，总能在沉重时刻留出呼吸，也让身边的人重新笑起来。',traits:['松弛','有感染力','暖场王'],belief:'纪念不只有眼泪，也可以带着共同拥有过的笑声。',color:'#ffb34b'},
    timid:{title:'超级胆小鬼',desc:'你不是没有勇气，只是感受比别人更细。面对告别会害怕、会舍不得，但也因此格外珍惜每一次相聚。',traits:['敏感','柔软','重感情'],belief:'承认害怕并不丢脸，愿意好好告别，本身就是一种勇敢。',color:'#8c85ff'},
    mischief:{title:'人间捣蛋鬼',desc:'规矩你都懂，但你更懂什么时候该给生活加点惊喜。你的古灵精怪，是善意的反叛。',traits:['有梗','胆大','不无聊'],belief:'敬畏告别，不等于拒绝鲜活；认真生活就是最好的纪念。',color:'#ff8f75'}
  };
  let index=0,scores={},chosen=[];const $=s=>document.querySelector(s);const screens=[...document.querySelectorAll('.screen')];
  function show(id){screens.forEach(x=>x.classList.toggle('active',x.id===id));scrollTo({top:0,behavior:'smooth'})}
  function render(){const item=questions[index];$('#step').textContent=`第 ${index+1} / ${questions.length} 题`;$('#progress').style.width=`${(index+1)/questions.length*100}%`;$('#question').textContent=item.q;$('#answers').innerHTML='';item.a.forEach((x,i)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="letter">${'ABCD'[i]}</span><span class="answer-label"></span>`;const label=b.querySelector('.answer-label');label.textContent=x[0];if(x[0].length>=12)label.classList.add('compact');b.onclick=()=>pick(x[1]);$('#answers').appendChild(b)});$('#back').style.visibility=index?'visible':'hidden'}
  function pick(type){chosen[index]=type;scores[type]=(scores[type]||0)+1;if(index<questions.length-1){index++;render()}else finish()}
  function finish(){show('loading');setTimeout(()=>{const max=Math.max(...Object.values(scores));const tied=Object.keys(scores).filter(k=>scores[k]===max);const key=tied[Math.floor(Math.random()*tied.length)];setResult(key);show('result')},900)}
  function setResult(key){const r=results[key];document.body.dataset.result=key;$('#resultTitle').textContent=r.title;$('#resultDesc').textContent=r.desc;$('#belief').textContent=`你相信：${r.belief}`;$('#traits').innerHTML=r.traits.map(t=>`<span>${t}</span>`).join('');$('#result').dataset.key=key;$('#resultGhostImage').src=ghostAssets[key];$('#resultGhostImage').alt=`${r.title}形象`}
  function restart(){index=0;scores={};chosen=[];render();show('intro')}
  $('#start').onclick=()=>{render();show('quiz')};$('#restart').onclick=restart;$('#back').onclick=()=>{if(!index)return;const old=chosen[index-1];scores[old]--;index--;render()};
  function drawResultGhost(x,cx,cy,s){x.save();x.translate(cx,cy);x.scale(s,s);x.fillStyle='#f4dfbd';x.strokeStyle='#d7a966';x.lineWidth=5;x.beginPath();x.moveTo(-40,-150);x.bezierCurveTo(100,-180,145,-75,105,45);x.bezierCurveTo(80,120,35,145,-15,110);x.bezierCurveTo(-70,70,-105,0,-88,-85);x.bezierCurveTo(-80,-125,-62,-145,-40,-150);x.fill();x.stroke();x.fillStyle='#ffb34b';x.beginPath();x.moveTo(-92,-162);x.lineTo(48,-177);x.lineTo(93,-113);x.lineTo(-31,-126);x.closePath();x.fill();x.strokeStyle='#f26e4d';x.lineWidth=5;x.beginPath();x.moveTo(-48,-153);x.bezierCurveTo(-20,-165,-30,-140,2,-146);x.stroke();x.strokeStyle='#352146';x.lineWidth=6;x.beginPath();x.arc(-15,-72,18,.2,2.8);x.stroke();x.beginPath();x.arc(35,-75,18,.2,2.8);x.stroke();x.fillStyle='#582d72';x.strokeStyle='#352146';x.lineWidth=5;x.fillRect(-12,-2,86,105);x.strokeRect(-12,-2,86,105);x.strokeStyle='#e6c78e';x.lineWidth=3;x.strokeRect(-3,7,68,87);x.strokeStyle='#568b55';x.lineWidth=8;x.beginPath();x.moveTo(-52,80);x.lineTo(-67,-20);x.stroke();x.fillStyle='#fffdf1';x.strokeStyle='#d9b763';x.lineWidth=3;for(let i=0;i<10;i++){const a=i*Math.PI/5;x.beginPath();x.ellipse(-70+Math.cos(a)*18,-34+Math.sin(a)*18,11,22,a,0,Math.PI*2);x.fill();x.stroke()}x.fillStyle='#e6c78e';x.beginPath();x.arc(-70,-34,13,0,Math.PI*2);x.fill();const flame=(dx,dy,color)=>{x.fillStyle=color;x.strokeStyle='#d69b4c';x.lineWidth=3;x.beginPath();x.moveTo(dx,dy-40);x.bezierCurveTo(dx+35,dy-12,dx+22,dy+35,dx,dy+42);x.bezierCurveTo(dx-30,dy+24,dx-24,dy-10,dx,dy-40);x.fill();x.stroke()};flame(-145,-50,'#ffb34b');flame(155,-45,'#79e1c5');x.restore()}
  function drawPoster(){const key=$('#result').dataset.key,r=results[key],c=$('#canvas'),x=c.getContext('2d');x.fillStyle='#050a27';x.fillRect(0,0,c.width,c.height);x.strokeStyle='rgba(141,128,105,.35)';x.lineWidth=2;for(let i=0;i<1080;i+=90){x.beginPath();x.moveTo(i,0);x.lineTo(i,1440);x.stroke()}for(let i=0;i<1440;i+=90){x.beginPath();x.moveTo(0,i);x.lineTo(1080,i);x.stroke()}x.fillStyle='#582d72';x.strokeStyle='#e6c78e';x.lineWidth=7;x.fillRect(140,65,800,120);x.strokeRect(140,65,800,120);x.textAlign='center';x.fillStyle='#f7e7c7';x.font='700 50px serif';x.fillText('测测你是什么鬼',540,145);x.fillStyle='#f7e7c7';x.fillRect(85,245,910,1040);x.strokeStyle='#e6c78e';x.lineWidth=9;x.strokeRect(85,245,910,1040);x.fillStyle='#352146';x.font='38px sans-serif';x.fillText('判官已阅 · 你的灵魂底色是',540,340);x.font='900 104px serif';wrapText(x,r.title,540,470,850,120);drawResultGhost(x,540,700,1.18);x.fillStyle='#352146';x.font='34px sans-serif';wrapText(x,r.desc,540,980,790,54);x.fillStyle='#582d72';x.font='700 42px serif';x.fillText(r.traits.join(' · '),540,1125);x.font='29px serif';wrapText(x,'「 '+r.belief+' 」',540,1200,820,45);x.fillStyle='#f7e7c7';x.font='34px serif';x.fillText('认真告别，也认真生活',540,1370);return c.toDataURL('image/png')}
  function wrapText(ctx,text,cx,y,max,line){let row='';const rows=[];for(const ch of text){if(ctx.measureText(row+ch).width>max){rows.push(row);row=ch}else row+=ch}rows.push(row);rows.forEach((s,i)=>ctx.fillText(s,cx,y+i*line));}
  $('#share').onclick=()=>{$('#poster').src=drawPoster();$('#dialog').showModal()};$('#close').onclick=()=>$('#dialog').close();$('#download').onclick=()=>{const a=document.createElement('a');a.download=`${$('#resultTitle').textContent}-中元鬼设.png`;a.href=$('#poster').src;a.click()};
  function drawGhostVariant(x,key,cx,cy,s){if(key==='steady'){drawResultGhost(x,cx,cy,s);return}x.save();x.translate(cx,cy);x.scale(s,s);x.lineJoin='round';const colors={wise:['#f4dfbd','#d7a966'],happy:['#8889f2','#6567cf'],gentle:['#b59bef','#7662c9'],creative:['#d0a7ed','#8a62ba'],mischief:['#a886ef','#6d52c4']}[key]||['#f4dfbd','#d7a966'];x.fillStyle=colors[0];x.strokeStyle=colors[1];x.lineWidth=5;x.beginPath();x.moveTo(-45,-145);x.bezierCurveTo(80,-180,135,-80,105,35);x.bezierCurveTo(90,95,50,125,5,102);x.bezierCurveTo(-35,83,-70,120,-92,91);x.bezierCurveTo(-65,48,-110,-12,-88,-88);x.bezierCurveTo(-78,-125,-62,-141,-45,-145);x.fill();x.stroke();const eye=(a,b)=>{x.fillStyle='#18203c';x.beginPath();x.ellipse(a,b,10,15,0,0,Math.PI*2);x.fill()};if(key==='wise'||key==='mischief'){x.fillStyle='#ffb34b';x.beginPath();x.moveTo(-93,-158);x.lineTo(40,-176);x.lineTo(92,-112);x.lineTo(-25,-126);x.closePath();x.fill()}if(key==='wise'){x.fillStyle='#fff7df';x.beginPath();x.ellipse(22,-70,34,16,-.12,0,Math.PI*2);x.fill();eye(39,-70);x.fillStyle='#ef6047';x.beginPath();x.ellipse(47,-14,25,52,-.12,0,Math.PI*2);x.fill()}if(key==='happy'){x.fillStyle='#f2a6c7';x.beginPath();x.moveTo(-85,-25);x.quadraticCurveTo(5,32,88,-22);x.lineTo(104,76);x.quadraticCurveTo(6,112,-83,62);x.closePath();x.fill();eye(-24,-72);eye(26,-72);x.strokeStyle='#fff7df';x.lineWidth=6;x.beginPath();x.arc(2,-44,30,.15,2.95);x.stroke()}if(key==='gentle'){x.fillStyle='#fff';x.beginPath();x.moveTo(-75,-133);x.lineTo(72,-145);x.lineTo(87,-105);x.lineTo(-87,-94);x.closePath();x.fill();x.stroke();x.beginPath();x.arc(2,-48,35,0,Math.PI*2);x.fill();x.stroke();x.fillStyle='#7356d0';x.beginPath();x.arc(2,-48,23,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(8,-56,8,0,Math.PI*2);x.fill()}if(key==='creative'){eye(-24,-71);eye(26,-71);x.fillStyle='#f7e7c7';x.strokeStyle='#e0b46a';x.beginPath();x.moveTo(-62,0);x.quadraticCurveTo(0,-18,63,0);x.lineTo(55,82);x.quadraticCurveTo(0,62,-55,82);x.closePath();x.fill();x.stroke();x.fillStyle='#ffb34b';for(let i=0;i<5;i++){let a=-Math.PI/2+i*Math.PI*2/5;x.beginPath();x.arc(75+Math.cos(a)*18,-30+Math.sin(a)*18,9,0,Math.PI*2);x.fill()}}if(key==='mischief'){x.strokeStyle='#33224a';x.lineWidth=6;x.beginPath();x.moveTo(-42,-66);x.lineTo(-12,-55);x.moveTo(42,-66);x.lineTo(12,-55);x.stroke();x.fillStyle='#fff';x.beginPath();x.moveTo(-26,-24);x.lineTo(-9,-2);x.lineTo(2,-28);x.lineTo(12,-28);x.lineTo(27,-2);x.lineTo(40,-25);x.fill();x.strokeStyle='#79e1c5';x.lineWidth=9;x.beginPath();x.arc(-118,-15,18,.5,5.6);x.arc(126,-8,18,.5,5.6);x.stroke()}x.restore()}
  function renderGhostCanvas(key){const c=$('#resultGhostCanvas');if(!c)return;const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);drawGhostVariant(x,key,210,158,.78)}
  const drawSteadyCore=drawResultGhost,drawVariantCore=drawGhostVariant;
  drawResultGhost=function(x,cx,cy,s){const key=$('#result').dataset.key||'wise';return drawVariantCore(x,key,cx,cy,s)};
  function loadGhostImage(key){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=ghostAssets[key]})}
  async function drawPosterWithCharacter(){const key=$('#result').dataset.key;drawPoster();const c=$('#canvas'),x=c.getContext('2d'),img=await loadGhostImage(key);x.fillStyle='#f7e7c7';x.fillRect(260,515,560,390);const maxW=520,maxH=370,scale=Math.min(maxW/img.naturalWidth,maxH/img.naturalHeight),w=img.naturalWidth*scale,h=img.naturalHeight*scale;x.drawImage(img,540-w/2,700-h/2,w,h);return c.toDataURL('image/png')}
  $('#share').onclick=async()=>{const button=$('#share'),old=button.textContent;button.disabled=true;button.textContent='正在生成…';try{$('#poster').src=await drawPosterWithCharacter();$('#dialog').showModal()}finally{button.disabled=false;button.textContent=old}};
